<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-label="How the solution is billed. Copilot Studio usage is measured in Copilot Credits: generative answers, agent actions such as each tool call, and model tokens. For users licensed for Microsoft 365 Copilot running under their own identity, usage is shown as no charge within fair use; other usage draws on prepaid capacity or a pay-as-you-go billing plan linked to an Azure subscription and resource group, where charges appear under the Power Platform account resource. Azure networking is billed in the resource group. Databricks Genie One and Genie Agents usage by users is free through 31 January 2027; the SQL Genie runs is billed as SQL warehouse usage.">
  <defs>
    <style>
      text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .title{font-size:25px;font-weight:700;fill:#0f1f2a}
      .subtitle{font-size:14px;fill:#5b6b76}
      .zl{font-size:12px;font-weight:700;letter-spacing:.08em}
      .h{font-size:14px;font-weight:600;fill:#0f1f2a}
      .s{font-size:12px;fill:#5b6b76}
      .t{font-size:12.5px;fill:#33424c}
      .m{font-family:Consolas,'Cascadia Mono',Menlo,monospace;font-size:11.5px;fill:#3d4b55}
      .node{fill:#fff;stroke:#c9d3da;stroke-width:1.2}
      .zone{stroke-width:1.4;stroke-dasharray:7 5}
      .a{stroke:#2563c9;stroke-width:2;fill:none}
      .c{stroke:#d98a00;stroke-width:2;fill:none}
    </style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f1f2a" flood-opacity=".10"/></filter>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d98a00"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="1499" height="719" rx="18" fill="#fff" stroke="#dfe5ea"/>
  <text class="title" x="40" y="50">How it's billed · where each cost lands</text>
  <text class="subtitle" x="40" y="76">Illustrative. Rates and promotions change, so confirm on the official billing pages (docs/09-references.md).</text>

  <rect class="zone" x="30" y="105" width="300" height="440" rx="14" fill="#f6f4fd" stroke="#b3a6e6"/>
  <text class="zl" x="48" y="131" fill="#5a3fb0">WHO ASKS</text>
  <rect class="zone" x="350" y="105" width="420" height="440" rx="14" fill="#f1f6fe" stroke="#94b6ea"/>
  <text class="zl" x="368" y="131" fill="#1d5fbf">COPILOT STUDIO · WHAT IS METERED</text>
  <rect class="zone" x="790" y="105" width="680" height="440" rx="14" fill="#eff8f3" stroke="#86c4a2"/>
  <text class="zl" x="808" y="131" fill="#1f7a4d">WHERE THE CHARGE APPEARS</text>

  <rect class="node" filter="url(#sh)" x="50" y="160" width="260" height="120" rx="10"/>
  <text class="h" x="70" y="186">User with a Microsoft 365</text>
  <text class="h" x="70" y="205">Copilot licence</text>
  <text class="t" x="70" y="229">agent runs under their own identity</text>
  <text class="t" x="70" y="249" fill="#1f7a4d">shown as “No charge”</text>
  <text class="s" x="70" y="268">fair-use limits apply</text>
  <rect class="node" filter="url(#sh)" x="50" y="310" width="260" height="110" rx="10"/>
  <text class="h" x="70" y="336">User without that licence</text>
  <text class="t" x="70" y="360">conversations consume the</text>
  <text class="t" x="70" y="380">tenant's Copilot Credits</text>
  <text class="s" x="70" y="402">prepaid pack or pay-as-you-go</text>
  <text class="s" x="50" y="460">Each Genie One question is about</text>
  <text class="s" x="50" y="478">1 ask + several polls + the answer:</text>
  <text class="s" x="50" y="496">roughly 10 agent actions plus</text>
  <text class="s" x="50" y="514">generative answer and model tokens.</text>

  <rect class="node" filter="url(#sh)" x="370" y="160" width="380" height="260" rx="10"/>
  <text class="h" x="390" y="186">Copilot Credits (published rates)</text>
  <text class="t" x="390" y="214">Classic answer</text><text class="m" x="720" y="214" text-anchor="end">1</text>
  <text class="t" x="390" y="240">Generative answer</text><text class="m" x="720" y="240" text-anchor="end">2</text>
  <text class="t" x="390" y="266">Agent action (each tool call, step)</text><text class="m" x="720" y="266" text-anchor="end">5</text>
  <text class="t" x="390" y="292">Premium model tokens</text><text class="m" x="720" y="292" text-anchor="end">10 / 1,000</text>
  <text class="t" x="390" y="318">Agent flow actions</text><text class="m" x="720" y="318" text-anchor="end">13 / 100</text>
  <line x1="390" y1="336" x2="730" y2="336" stroke="#e3e8ec"/>
  <text class="s" x="390" y="358">Prepaid capacity is pooled per tenant and resets</text>
  <text class="s" x="390" y="376">monthly. With pay-as-you-go overage, agents</text>
  <text class="s" x="390" y="394">aren't blocked when prepaid credits run out.</text>
  <path class="c" d="M310,365 H368" marker-end="url(#mo)"/>
  <path class="a" d="M750,290 H806" marker-end="url(#mb)"/>

  <rect class="node" filter="url(#sh)" x="810" y="160" width="320" height="170" rx="10"/>
  <text class="h" x="830" y="186">Pay-as-you-go billing plan</text>
  <text class="t" x="830" y="210">environment → Azure subscription</text>
  <text class="t" x="830" y="230">and resource group</text>
  <text class="m" x="830" y="254">Power Platform account resource</text>
  <text class="s" x="830" y="276">charges appear under this resource</text>
  <text class="s" x="830" y="294">on the Azure bill</text>
  <text class="s" x="830" y="316">budget alerts on the resource group</text>

  <rect class="node" filter="url(#sh)" x="1150" y="160" width="300" height="170" rx="10"/>
  <text class="h" x="1170" y="186">Azure networking</text>
  <text class="t" x="1170" y="210">VNets, delegated subnets: free</text>
  <text class="t" x="1170" y="230">Global peering: per GB each way</text>
  <text class="t" x="1170" y="250">Private endpoints: hourly + per GB</text>
  <text class="t" x="1170" y="270">Private DNS: per zone + queries</text>
  <text class="t" x="1170" y="290">Bastion Developer SKU: no hourly charge</text>
  <text class="s" x="1170" y="314">same resource group, same budget</text>

  <rect class="node" filter="url(#sh)" x="810" y="350" width="640" height="175" rx="10"/>
  <text class="h" x="830" y="376">Azure Databricks</text>
  <text class="t" x="830" y="402" fill="#1f7a4d">Genie One and Genie Agents usage by users: free through 31 January 2027</text>
  <text class="s" x="830" y="420">(service principals are billed)</text>
  <text class="t" x="830" y="446">The SQL Genie runs is billed as SQL warehouse usage (DBUs)</text>
  <text class="s" x="830" y="466">serverless warehouse with a short auto-stop keeps idle cost near zero</text>
  <text class="t" x="830" y="492">Power Platform VNet support itself has no separate meter</text>
  <text class="s" x="830" y="510">you pay only for the Azure networking above</text>

  <rect x="30" y="565" width="1440" height="135" rx="14" fill="#f7f9fb" stroke="#e3e8ec"/>
  <text class="zl" x="50" y="592" fill="#33424c">COST CONTROLS IN THIS BUILD</text>
  <text class="t" x="50" y="618">• Resource-group budget with alerts at 50 / 80 / 100 % actual and 100 % forecast, created before the agent was published.</text>
  <text class="t" x="50" y="642">• Serverless SQL warehouse with auto-stop. Admin jumpbox with a daily auto-shutdown schedule.</text>
  <text class="t" x="50" y="666">• Copilot Studio capacity and consumption reviewed in the Power Platform admin center; Azure spend reviewed monthly in Cost Management.</text>
  <text class="t" x="50" y="690">• Licensing a frequent user for Microsoft 365 Copilot can be cheaper than their pay-as-you-go usage. Compare both for heavy users.</text>
</svg>
