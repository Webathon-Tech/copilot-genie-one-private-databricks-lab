<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="830" viewBox="0 0 1500 830" role="img" aria-label="Fully private path with Power Platform VNet support. A Copilot Studio agent runs in a managed Power Platform environment linked to an enterprise policy with two delegated subnets, one in Canada Central and one in Canada East. The Canada Central subnet reaches the workspace private endpoint directly; the Canada East subnet reaches it through VNet peering. The private DNS zone is linked to both virtual networks. The workspace has public network access disabled.">
  <defs>
    <style>
      text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .title{font-size:25px;font-weight:700;fill:#0f1f2a}
      .subtitle{font-size:14px;fill:#5b6b76}
      .zl{font-size:12px;font-weight:700;letter-spacing:.08em}
      .h{font-size:14px;font-weight:600}.h:not([fill]){fill:#0f1f2a}
      .s{font-size:12px}.s:not([fill]){fill:#5b6b76}
      .t{font-size:12.5px}.t:not([fill]){fill:#33424c}
      .m{font-family:Consolas,'Cascadia Mono',Menlo,monospace;font-size:11.5px}.m:not([fill]){fill:#3d4b55}
      .lbl{font-size:11.5px;font-weight:600}.lbl:not([fill]){fill:#33424c}
      .node{fill:#fff;stroke:#c9d3da;stroke-width:1.2}
      .zone{stroke-width:1.4;stroke-dasharray:7 5}
      .z-ms{fill:#f1f6fe;stroke:#94b6ea}
      .z-az{fill:#eff8f3;stroke:#86c4a2}
      .z-dbx{fill:#fef5f2;stroke:#eea48f}
      .new{fill:#fff;stroke:#d98a00;stroke-width:1.6}
      .a{stroke:#2563c9;stroke-width:2;fill:none}
      .pl{stroke:#1f8a5b;stroke-width:2.4;fill:none}
      .badge{fill:#d98a00}
      .bt{font-size:11.5px;font-weight:700;fill:#fff}
    </style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f1f2a" flood-opacity=".10"/></filter>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8a96"/></marker>
    <symbol id="ok" viewBox="-9 -9 18 18"><circle r="8.5" fill="#1f8a5b"/><path d="M-4 0.2 L-1.2 3 L4 -2.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="lock" viewBox="-8 -9 16 18"><rect x="-6" y="-1" width="12" height="9" rx="2" fill="#c0392b"/><path d="M-3.5 -1 V-4 A3.5 3.5 0 0 1 3.5 -4 V-1" stroke="#c0392b" stroke-width="1.8" fill="none"/></symbol>
  </defs>

  <rect x="0.5" y="0.5" width="1499" height="829" rx="18" fill="#ffffff" stroke="#dfe5ea"/>
  <text class="title" x="40" y="50">Fully private path with Power Platform VNet support (built and verified)</text>
  <text class="subtitle" x="40" y="75">Copilot Studio traffic leaves Microsoft's cloud inside your own subnets and reaches the workspace only through its private endpoint. Example values shown.</text>
  <circle cx="1252" cy="72" r="9" class="badge"/><text class="bt" x="1252" y="76" text-anchor="middle">1</text>
  <text class="s" x="1268" y="77">setup step</text>

  <!-- zones -->
  <rect class="zone z-ms" x="30" y="105" width="355" height="590" rx="14"/>
  <text class="zl" x="48" y="131" fill="#1d5fbf">MICROSOFT CLOUD · POWER PLATFORM</text>
  <rect class="zone z-az" x="405" y="105" width="605" height="380" rx="14"/>
  <text class="zl" x="423" y="131" fill="#1f7a4d">AZURE · CANADA CENTRAL</text>
  <text class="m" x="423" y="149">vnet-genie-demo · 10.10.0.0/20</text>
  <rect class="zone z-az" x="405" y="505" width="605" height="190" rx="14"/>
  <text class="zl" x="423" y="531" fill="#1f7a4d">AZURE · CANADA EAST (PAIRED REGION)</text>
  <text class="m" x="423" y="549">vnet-genie-demo-cne · 10.11.0.0/24</text>
  <rect class="zone z-dbx" x="1030" y="105" width="440" height="590" rx="14"/>
  <text class="zl" x="1048" y="131" fill="#c8442b">AZURE DATABRICKS · dbw-genie-demo</text>

  <!-- microsoft -->
  <rect class="node" filter="url(#sh)" x="50" y="155" width="315" height="70" rx="10"/>
  <text class="h" x="207" y="183" text-anchor="middle">Copilot Studio agent</text>
  <text class="s" x="207" y="203" text-anchor="middle">“Ask Genie” · Genie One connector · end user account</text>
  <rect class="node" filter="url(#sh)" x="50" y="262" width="315" height="84" rx="10"/>
  <text class="h" x="207" y="288" text-anchor="middle">Power Platform environment</text>
  <text class="s" x="207" y="307" text-anchor="middle">“Genie Copilot” · Production · region Canada</text>
  <text class="s" x="207" y="325" text-anchor="middle">Managed Environment</text>
  <rect class="new" filter="url(#sh)" x="50" y="384" width="315" height="124" rx="10"/>
  <text class="h" x="68" y="409">Enterprise policy · NetworkInjection</text>
  <text class="m" x="68" y="432">subnet 1 · snet-pp-cnc (Canada Central)</text>
  <text class="m" x="68" y="452">subnet 2 · snet-pp-cne (Canada East)</text>
  <text class="s" x="68" y="476">PowerShell module</text>
  <text class="m" x="68" y="494" style="font-size:10.8px">Microsoft.PowerPlatform.EnterprisePolicies</text>
  <circle cx="365" cy="384" r="11" class="badge"/><text class="bt" x="365" y="388" text-anchor="middle">5</text>
  <rect class="new" filter="url(#sh)" x="50" y="548" width="315" height="124" rx="10"/>
  <text class="h" x="68" y="573">Link policy to environment</text>
  <text class="m" x="68" y="596">Enable-SubnetInjection</text>
  <text class="s" x="68" y="618">or admin center: Security → Data and</text>
  <text class="s" x="68" y="635">privacy → Azure Virtual Network policies</text>
  <text class="s" x="68" y="657" fill="#9a5b00" style="font-weight:600">plan for up to 30 minutes of disruption</text>
  <circle cx="365" cy="548" r="11" class="badge"/><text class="bt" x="365" y="552" text-anchor="middle">6</text>

  <line class="a" x1="207" y1="225" x2="207" y2="260" marker-end="url(#mb)"/>
  <text class="lbl" x="216" y="247">runs in</text>
  <line class="a" x1="207" y1="384" x2="207" y2="348" marker-end="url(#mb)" style="stroke:#d98a00"/>
  <text class="lbl" x="216" y="370" fill="#9a5b00">injects the environment</text>
  <line class="a" x1="207" y1="548" x2="207" y2="510" marker-end="url(#mb)" style="stroke:#d98a00"/>
  <text class="lbl" x="216" y="533" fill="#9a5b00">activates</text>

  <!-- canada central -->
  <rect x="425" y="165" width="565" height="300" rx="12" fill="#e4f3ea" stroke="#86c4a2"/>
  <rect class="new" filter="url(#sh)" x="445" y="190" width="255" height="100" rx="10"/>
  <text class="h" x="463" y="214">snet-pp-cnc</text>
  <text class="m" x="463" y="234">10.10.3.0/26</text>
  <text class="s" x="463" y="252">delegated to</text>
  <text class="m" x="463" y="268" style="font-size:10.8px">Microsoft.PowerPlatform/</text>
  <text class="m" x="463" y="283" style="font-size:10.8px">enterprisePolicies</text>
  <circle cx="700" cy="190" r="11" class="badge"/><text class="bt" x="700" y="194" text-anchor="middle">1</text>

  <rect class="node" filter="url(#sh)" x="740" y="190" width="230" height="100" rx="10" stroke="#1f8a5b" stroke-width="1.6"/>
  <text class="h" x="855" y="216" text-anchor="middle">Private endpoint</text>
  <text class="m" x="855" y="238" text-anchor="middle">databricks_ui_api</text>
  <text class="m" x="855" y="258" text-anchor="middle">10.10.2.4</text>
  <use href="#ok" x="948" y="196" width="16" height="16"/>
  <text class="s" x="855" y="279" text-anchor="middle">already in place</text>

  <rect class="node" filter="url(#sh)" x="445" y="330" width="255" height="118" rx="10"/>
  <text class="h" x="463" y="354">Private DNS zone</text>
  <text class="m" x="463" y="374" style="font-size:10.8px">privatelink.azuredatabricks.net</text>
  <text class="m" x="463" y="394" style="font-size:10.8px">adb-1234567890123456.7</text>
  <text class="m" x="463" y="411" style="font-size:10.8px">  → 10.10.2.4</text>
  <text class="s" x="463" y="434">linked to both VNets</text>
  <circle cx="700" cy="330" r="11" class="badge"/><text class="bt" x="700" y="334" text-anchor="middle">4</text>

  <line class="a" x1="700" y1="240" x2="738" y2="240" marker-end="url(#mb)"/>
  <text class="lbl" x="719" y="300" text-anchor="middle" style="font-size:10.5px">HTTPS</text>
  <text class="lbl" x="719" y="313" text-anchor="middle" style="font-size:10.5px">443</text>

  <!-- canada east -->
  <rect class="new" filter="url(#sh)" x="445" y="565" width="255" height="110" rx="10"/>
  <text class="h" x="463" y="589">snet-pp-cne</text>
  <text class="m" x="463" y="609">10.11.0.0/26</text>
  <text class="s" x="463" y="630">same delegation and same size</text>
  <text class="s" x="463" y="648">as snet-pp-cnc (failover region)</text>
  <circle cx="700" cy="565" r="11" class="badge"/><text class="bt" x="700" y="569" text-anchor="middle">2</text>

  <rect class="new" filter="url(#sh)" x="740" y="565" width="230" height="110" rx="10"/>
  <text class="h" x="855" y="591" text-anchor="middle">VNet peering</text>
  <text class="s" x="855" y="612" text-anchor="middle">vnet-genie-demo-cne ↔</text>
  <text class="s" x="855" y="629" text-anchor="middle">vnet-genie-demo, both ways</text>
  <text class="s" x="855" y="650" text-anchor="middle">reaches 10.10.2.4</text>
  <circle cx="970" cy="565" r="11" class="badge"/><text class="bt" x="970" y="569" text-anchor="middle">3</text>

  <line class="a" x1="700" y1="620" x2="738" y2="620" marker-end="url(#mb)"/>
  <line class="a" x1="855" y1="565" x2="855" y2="292" marker-end="url(#mb)" style="stroke-dasharray:6 4"/>
  <text class="lbl" x="864" y="400">failover</text>

  <!-- databricks -->
  <rect x="1048" y="145" width="156" height="24" rx="12" fill="#fde8e4" stroke="#e2876f"/>
  <use href="#lock" x="1057" y="148" width="14" height="17"/>
  <text class="lbl" x="1076" y="162" fill="#a8321f">public access: OFF</text>
  <circle cx="1218" cy="157" r="11" class="badge"/><text class="bt" x="1218" y="161" text-anchor="middle">7</text>

  <rect class="node" filter="url(#sh)" x="1050" y="190" width="400" height="100" rx="10"/>
  <text class="h" x="1250" y="216" text-anchor="middle">Workspace front end</text>
  <text class="m" x="1250" y="238" text-anchor="middle" style="font-size:10.8px">adb-1234567890123456.7.azuredatabricks.net</text>
  <text class="s" x="1250" y="260" text-anchor="middle">public network access: Disabled</text>
  <text class="s" x="1250" y="278" text-anchor="middle">requiredNsgRules: NoAzureDatabricksRules</text>
  <line class="pl" x1="970" y1="240" x2="1048" y2="240" marker-end="url(#mg)"/>
  <text class="lbl" x="1009" y="232" text-anchor="middle" fill="#1f7a4d" style="font-size:10.5px">Private Link</text>

  <rect class="node" filter="url(#sh)" x="1050" y="330" width="400" height="76" rx="10"/>
  <text class="h" x="1250" y="358" text-anchor="middle">Genie One MCP · domain agents</text>
  <text class="s" x="1250" y="379" text-anchor="middle">unchanged from phase 1 · user's own permissions</text>
  <line class="a" x1="1250" y1="290" x2="1250" y2="328" marker-end="url(#mb)"/>

  <rect class="node" x="1050" y="440" width="400" height="236" rx="10"/>
  <text class="h" x="1068" y="466">Retest after the switch</text>
  <text class="m" x="1068" y="494">T4</text><text class="t" x="1100" y="494">Domain agent answers in Teams</text>
  <text class="m" x="1068" y="520">T5</text><text class="t" x="1100" y="520">Genie One answers a cross-domain question</text>
  <text class="m" x="1068" y="546">T6</text><text class="t" x="1100" y="546">Audit log shows each user's own identity</text>
  <text class="m" x="1068" y="572">T7</text><text class="t" x="1100" y="572">Internet call gets 403; Copilot still answers</text>
  <line x1="1068" y1="590" x2="1432" y2="590" stroke="#e3e9ee"/>
  <text class="t" x="1068" y="614" fill="#1f7a4d" style="font-weight:600">All pass → recommend the fully private design</text>
  <text class="t" x="1068" y="640" fill="#9a5b00" style="font-weight:600">Copilot can't connect → evaluate fallbacks B or C</text>
  <text class="s" x="1068" y="662">(see the network options diagram)</text>

  <!-- steps -->
  <rect class="node" x="30" y="712" width="1440" height="104" rx="12"/>
  <text class="h" x="50" y="737">Set-up order</text>
  <g>
    <circle cx="59" cy="760" r="9" class="badge"/><text class="bt" x="59" y="764" text-anchor="middle">1</text><text class="t" x="76" y="765">Create snet-pp-cnc and delegate it to Power Platform.</text>
    <circle cx="59" cy="786" r="9" class="badge"/><text class="bt" x="59" y="790" text-anchor="middle">2</text><text class="t" x="76" y="791">Create the Canada East VNet and snet-pp-cne, same size.</text>
    <circle cx="520" cy="760" r="9" class="badge"/><text class="bt" x="520" y="764" text-anchor="middle">3</text><text class="t" x="537" y="765">Peer the two VNets in both directions.</text>
    <circle cx="520" cy="786" r="9" class="badge"/><text class="bt" x="520" y="790" text-anchor="middle">4</text><text class="t" x="537" y="791">Link the private DNS zone to the Canada East VNet.</text>
    <circle cx="920" cy="760" r="9" class="badge"/><text class="bt" x="920" y="764" text-anchor="middle">5</text><text class="t" x="937" y="765">Create the enterprise policy with both subnets.</text>
    <circle cx="920" cy="786" r="9" class="badge"/><text class="bt" x="920" y="790" text-anchor="middle">6</text><text class="t" x="937" y="791">Link it to the environment; 7 · switch public access off.</text>
  </g>
</svg>
