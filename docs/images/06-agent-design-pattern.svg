<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-label="Designing domain agents. Avoid: an agent that includes drilling.wells, which completions users cannot read, is disabled entirely for them. Do: use the completions.well_header view exposing only well_id, play and rig; the view reads drilling.wells with its owner's rights, so comp.user can slice by play and rig but still cannot see drilling days.">
  <defs>
    <style>
      text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .title{font-size:25px;font-weight:700;fill:#0f1f2a}
      .subtitle{font-size:14px;fill:#5b6b76}
      .zl{font-size:12px;font-weight:700;letter-spacing:.08em}
      .h{font-size:14px;font-weight:600}.h:not([fill]){fill:#0f1f2a}
      .s{font-size:12px}.s:not([fill]){fill:#5b6b76}
      .t{font-size:12.5px}.t:not([fill]){fill:#33424c}
      .m{font-family:Consolas,'Cascadia Mono',Menlo,monospace;font-size:11.5px}.m:not([fill]){fill:#3d4b55}
      .lbl{font-size:11.5px;font-weight:600}.lbl:not([fill]){fill:#33424c}
      .node{fill:#fff;stroke:#c9d3da;stroke-width:1.2}
      .okrow{fill:#effaf3;stroke:#9fd5b7}
      .norow{fill:#fdecea;stroke:#eba59c}
      .col{fill:#fff;stroke:#c9d3da}
      .colok{fill:#e3f5ea;stroke:#7fc49c}
      .a{stroke:#2563c9;stroke-width:2;fill:none}
    </style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f1f2a" flood-opacity=".10"/></filter>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fc4"/></marker>
    <symbol id="ok" viewBox="-9 -9 18 18"><circle r="8.5" fill="#1f8a5b"/><path d="M-4 0.2 L-1.2 3 L4 -2.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="no" viewBox="-9 -9 18 18"><circle r="8.5" fill="#c0392b"/><path d="M-3.5 -3.5 L3.5 3.5 M3.5 -3.5 L-3.5 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="user" viewBox="-14 -14 28 28"><circle cy="-5" r="6" fill="#5b7a99"/><path d="M-11 12 C-11 2 11 2 11 12 Z" fill="#5b7a99"/></symbol>
    <symbol id="warn" viewBox="-10 -9 20 18"><path d="M0 -8 L9 8 H-9 Z" fill="#d98a00"/><path d="M0 -2.5 V3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cy="5.6" r="1.1" fill="#fff"/></symbol>
  </defs>

  <rect x="0.5" y="0.5" width="1499" height="719" rx="18" fill="#ffffff" stroke="#dfe5ea"/>
  <text class="title" x="40" y="50">Designing domain agents · mixed tables vs a curated view</text>
  <text class="subtitle" x="40" y="75">Completions users need play and rig to slice their data, but should never see the drilling team's performance data.</text>

  <!-- ===================== BEFORE ===================== -->
  <rect x="30" y="98" width="705" height="478" rx="14" fill="#fff6f5" stroke="#e6a3a3" stroke-width="1.3"/>
  <text class="zl" x="50" y="124" fill="#b42318">AVOID · ADDING ANOTHER DOMAIN'S TABLE TO AN AGENT</text>

  <rect class="node" filter="url(#sh)" x="50" y="186" width="160" height="74" rx="10"/>
  <use href="#user" x="60" y="198" width="28" height="28"/>
  <text class="h" x="96" y="216">comp.user</text>
  <text class="m" x="60" y="246" style="font-size:10.5px">grp-genie-completions</text>
  <line class="a" x1="210" y1="223" x2="243" y2="223" marker-end="url(#mb)"/>

  <rect class="node" filter="url(#sh)" x="245" y="150" width="290" height="150" rx="10"/>
  <text class="h" x="263" y="176">Completions agent</text>
  <rect class="okrow" x="263" y="190" width="254" height="44" rx="7"/>
  <use href="#ok" x="271" y="203" width="18" height="18"/>
  <text class="m" x="297" y="207">completions.completions</text>
  <text class="s" x="297" y="224" style="font-size:11px">SELECT granted</text>
  <rect class="norow" x="263" y="242" width="254" height="44" rx="7"/>
  <use href="#no" x="271" y="255" width="18" height="18"/>
  <text class="m" x="297" y="259">drilling.wells</text>
  <text class="s" x="297" y="276" style="font-size:11px" fill="#a8321f">no SELECT · drilling schema</text>
  <line x1="535" y1="225" x2="563" y2="225" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/>

  <rect x="565" y="150" width="150" height="150" rx="10" fill="#fdecea" stroke="#e08a8a" stroke-width="1.4" filter="url(#sh)"/>
  <use href="#no" x="625" y="166" width="30" height="30"/>
  <text class="h" x="640" y="226" text-anchor="middle" fill="#a8321f">Agent disabled</text>
  <text class="s" x="640" y="246" text-anchor="middle">ask box blocked</text>
  <text class="s" x="640" y="263" text-anchor="middle">for every question,</text>
  <text class="s" x="640" y="280" text-anchor="middle">not just drilling ones</text>

  <rect class="node" x="50" y="322" width="665" height="58" rx="10" style="stroke:#e6a3a3"/>
  <use href="#warn" x="64" y="338" width="20" height="18"/>
  <text class="lbl" x="94" y="345" fill="#a8321f">Banner users without access see</text>
  <text class="m" x="94" y="366">“You don't have SELECT access on 'dbw_genie_demo.drilling.wells'.”</text>

  <text class="zl" x="50" y="414" fill="#5b6b76" style="font-size:10.5px">WHAT comp.user CAN READ</text>
  <rect class="okrow" x="50" y="424" width="200" height="34" rx="7"/><use href="#ok" x="60" y="432" width="18" height="18"/><text class="m" x="86" y="446">completions schema</text>
  <rect class="norow" x="262" y="424" width="200" height="34" rx="7"/><use href="#no" x="272" y="432" width="18" height="18"/><text class="m" x="298" y="446">drilling schema</text>
  <rect class="norow" x="474" y="424" width="200" height="34" rx="7"/><use href="#no" x="484" y="432" width="18" height="18"/><text class="m" x="510" y="446">production schema</text>

  <rect x="50" y="478" width="665" height="80" rx="10" fill="#fff" stroke="#e6a3a3" stroke-dasharray="5 4"/>
  <text class="h" x="68" y="502">Why to avoid it</text>
  <text class="t" x="68" y="524">A Genie agent works only for users who can read every table in it.</text>
  <text class="t" x="68" y="544">One unreadable table blocks the whole agent, not just the questions that need it.</text>

  <!-- ===================== AFTER ===================== -->
  <rect x="765" y="98" width="705" height="478" rx="14" fill="#f2faf5" stroke="#86c4a2" stroke-width="1.3"/>
  <text class="zl" x="785" y="124" fill="#1f7a4d">DO · SHARE ONLY THE NEEDED COLUMNS THROUGH A VIEW</text>

  <rect class="node" filter="url(#sh)" x="785" y="186" width="160" height="74" rx="10"/>
  <use href="#user" x="795" y="198" width="28" height="28"/>
  <text class="h" x="831" y="216">comp.user</text>
  <text class="m" x="795" y="246" style="font-size:10.5px">grp-genie-completions</text>
  <line class="a" x1="945" y1="223" x2="978" y2="223" marker-end="url(#mb)"/>

  <rect class="node" filter="url(#sh)" x="980" y="150" width="290" height="150" rx="10"/>
  <text class="h" x="998" y="176">Completions agent</text>
  <rect class="okrow" x="998" y="190" width="254" height="44" rx="7"/>
  <use href="#ok" x="1006" y="203" width="18" height="18"/>
  <text class="m" x="1032" y="207">completions.completions</text>
  <text class="s" x="1032" y="224" style="font-size:11px">SELECT granted</text>
  <rect class="okrow" x="998" y="242" width="254" height="44" rx="7"/>
  <use href="#ok" x="1006" y="255" width="18" height="18"/>
  <text class="m" x="1032" y="259">completions.well_header</text>
  <text class="s" x="1032" y="276" style="font-size:11px">view · well_id, play, rig</text>
  <line x1="1270" y1="225" x2="1298" y2="225" stroke="#1f8a5b" stroke-width="2" marker-end="url(#mg)"/>

  <rect x="1300" y="150" width="150" height="150" rx="10" fill="#e3f5ea" stroke="#7fc49c" stroke-width="1.4" filter="url(#sh)"/>
  <use href="#ok" x="1360" y="166" width="30" height="30"/>
  <text class="h" x="1375" y="226" text-anchor="middle" fill="#1f7a4d">Agent works</text>
  <text class="s" x="1375" y="246" text-anchor="middle">play and rig: yes</text>
  <text class="s" x="1375" y="263" text-anchor="middle">drilling days: no</text>
  <text class="s" x="1375" y="280" text-anchor="middle">no warning banner</text>

  <rect class="node" filter="url(#sh)" x="785" y="326" width="310" height="112" rx="10"/>
  <text class="h" x="801" y="349">drilling.wells</text><text class="s" x="896" y="349">drilling schema</text>
  <rect class="colok" x="797" y="360" width="92" height="26" rx="6"/><text class="m" x="843" y="377" text-anchor="middle">well_id</text>
  <rect class="colok" x="897" y="360" width="92" height="26" rx="6"/><text class="m" x="943" y="377" text-anchor="middle">play</text>
  <rect class="colok" x="997" y="360" width="86" height="26" rx="6"/><text class="m" x="1040" y="377" text-anchor="middle">rig</text>
  <rect class="col" x="797" y="394" width="92" height="26" rx="6"/><text class="m" x="843" y="411" text-anchor="middle" fill="#a0aab3">spud_date</text>
  <rect class="col" x="897" y="394" width="92" height="26" rx="6"/><text class="m" x="943" y="411" text-anchor="middle" fill="#a0aab3" style="font-size:10.5px">total_depth_m</text>
  <rect class="col" x="997" y="394" width="86" height="26" rx="6"/><text class="m" x="1040" y="411" text-anchor="middle" fill="#a0aab3" style="font-size:10px">drilling_days</text>
  <line x1="801" y1="407" x2="885" y2="407" stroke="#c0392b" stroke-width="1" opacity=".55"/>
  <line x1="901" y1="407" x2="985" y2="407" stroke="#c0392b" stroke-width="1" opacity=".55"/>
  <line x1="1001" y1="407" x2="1079" y2="407" stroke="#c0392b" stroke-width="1" opacity=".55"/>

  <path d="M1095,382 H1123" stroke="#7a4fc4" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#mp)"/>
  <text class="lbl" x="1109" y="372" text-anchor="middle" fill="#6a46b0" style="font-size:10px">owner</text>
  <text class="lbl" x="1109" y="400" text-anchor="middle" fill="#6a46b0" style="font-size:10px">rights</text>

  <rect x="1125" y="326" width="325" height="112" rx="10" fill="#f6f2fc" stroke="#bba6e0" stroke-width="1.3" filter="url(#sh)"/>
  <text class="h" x="1141" y="349">completions.well_header</text><text class="s" x="1316" y="349">view</text>
  <text class="m" x="1141" y="372">CREATE OR REPLACE VIEW</text>
  <text class="m" x="1141" y="389">  completions.well_header AS</text>
  <text class="m" x="1141" y="406">SELECT well_id, play, rig</text>
  <text class="m" x="1141" y="423">FROM drilling.wells;</text>
  <line class="a" x1="1240" y1="326" x2="1240" y2="290" marker-end="url(#mb)" style="stroke:#7a4fc4"/>

  <text class="zl" x="785" y="466" fill="#5b6b76" style="font-size:10.5px">VERIFIED AS comp.user</text>
  <rect class="node" x="785" y="476" width="665" height="82" rx="10"/>
  <use href="#ok" x="799" y="487" width="17" height="17"/><text class="t" x="824" y="500">“Which 10 wells took longest to complete?”: answered (14.5 to 14.9 days)</text>
  <use href="#ok" x="799" y="509" width="17" height="17"/><text class="t" x="824" y="522">“Average proppant per stage by play”: Anadarko 89.37 · Permian 79.36 · Duvernay 76.97 · Montney 74.12</text>
  <use href="#ok" x="799" y="531" width="17" height="17"/><text class="t" x="824" y="544">“Average drilling days by rig”: refused, no drilling-days column available</text>

  <!-- ===================== PATTERN ===================== -->
  <rect x="30" y="596" width="1440" height="108" rx="12" fill="#f6f8fa" stroke="#c9d3da"/>
  <text class="h" x="50" y="622">Recommended pattern</text>
  <circle cx="58" cy="645" r="4" fill="#2563c9"/><text class="t" x="70" y="650">Build each domain agent only from tables that every one of its users can read.</text>
  <circle cx="58" cy="667" r="4" fill="#7a4fc4"/><text class="t" x="70" y="672">Expose shared attributes, such as the well header, field or asset hierarchy, as curated views in the domain's own schema.</text>
  <circle cx="58" cy="689" r="4" fill="#d9622b"/><text class="t" x="70" y="694">For questions that span domains, build a purpose-made agent; use Genie One only if grants are least-privilege.</text>
</svg>
