<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-label="Identity without secrets. A user creates their connection by signing in to Microsoft Entra ID through the app copilot-genie-one-mcp. Entra checks that the user is assigned and redirects to the Power Platform consent service. The connector redeems the authorization code using a client assertion issued to its managed identity instead of a client secret; Entra accepts it because the app has a federated credential for that issuer and subject. Entra issues a delegated token for Azure Databricks in the user's name. Databricks accepts the Entra token and applies Unity Catalog grants for that user.">
  <defs>
    <style>
      text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .title{font-size:25px;font-weight:700;fill:#0f1f2a}
      .subtitle{font-size:14px;fill:#5b6b76}
      .zl{font-size:12px;font-weight:700;letter-spacing:.08em}
      .h{font-size:14px;font-weight:600;fill:#0f1f2a}
      .s{font-size:12px;fill:#5b6b76}
      .t{font-size:12.5px;fill:#33424c}
      .m{font-family:Consolas,'Cascadia Mono',Menlo,monospace;font-size:11.5px;fill:#3d4b55}
      .node{fill:#fff;stroke:#c9d3da;stroke-width:1.2}
      .zone{stroke-width:1.4;stroke-dasharray:7 5}
      .a{stroke:#2563c9;stroke-width:2;fill:none}
      .id{stroke:#7c4dcc;stroke-width:2;fill:none}
      .badge{fill:#d98a00}
      .bt{font-size:11.5px;font-weight:700;fill:#fff}
    </style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f1f2a" flood-opacity=".10"/></filter>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563c9"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c4dcc"/></marker>
    <symbol id="ok" viewBox="-9 -9 18 18"><circle r="8.5" fill="#1f8a5b"/><path d="M-4 0.2 L-1.2 3 L4 -2.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="no" viewBox="-9 -9 18 18"><circle r="8.5" fill="#c0392b"/><path d="M-3.5 -3.5 L3.5 3.5 M3.5 -3.5 L-3.5 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>

  <rect x="0.5" y="0.5" width="1499" height="859" rx="18" fill="#fff" stroke="#dfe5ea"/>
  <text class="title" x="40" y="50">Identity without secrets · user sign-in and the connector's managed identity</text>
  <text class="subtitle" x="40" y="76">Users sign in as themselves. The connector proves it is the trusted connector with a federated credential, so the app has no client secret.</text>

  <!-- columns -->
  <rect class="zone" x="30" y="105" width="300" height="470" rx="14" fill="#f6f4fd" stroke="#b3a6e6"/>
  <text class="zl" x="48" y="131" fill="#5a3fb0">USER</text>
  <rect class="zone" x="350" y="105" width="400" height="470" rx="14" fill="#f6f4fd" stroke="#b3a6e6"/>
  <text class="zl" x="368" y="131" fill="#5a3fb0">MICROSOFT ENTRA ID</text>
  <rect class="zone" x="770" y="105" width="370" height="470" rx="14" fill="#f1f6fe" stroke="#94b6ea"/>
  <text class="zl" x="788" y="131" fill="#1d5fbf">POWER PLATFORM · CONNECTOR</text>
  <rect class="zone" x="1160" y="105" width="310" height="470" rx="14" fill="#fef5f2" stroke="#eea48f"/>
  <text class="zl" x="1178" y="131" fill="#c8442b">AZURE DATABRICKS</text>

  <!-- user -->
  <rect class="node" filter="url(#sh)" x="50" y="160" width="260" height="100" rx="10"/>
  <text class="h" x="70" y="187">Connect once</text>
  <text class="t" x="70" y="209">The Connect card on the first question,</text>
  <text class="t" x="70" y="227">or the setup link → signs in</text>
  <text class="s" x="70" y="247">once per user, before the first chat</text>
  <rect class="node" filter="url(#sh)" x="50" y="420" width="260" height="120" rx="10"/>
  <text class="h" x="70" y="447">Chat in Copilot or Teams</text>
  <text class="t" x="70" y="469">Every tool call uses the user's</text>
  <text class="t" x="70" y="487">own stored connection</text>
  <text class="s" x="70" y="510">tool authentication:</text>
  <text class="m" x="70" y="528">End user account</text>

  <!-- entra -->
  <rect class="node" filter="url(#sh)" x="370" y="160" width="360" height="150" rx="10"/>
  <text class="h" x="390" y="187">App registration · copilot-genie-one-mcp</text>
  <text class="t" x="390" y="210">Single tenant · delegated AzureDatabricks</text>
  <text class="m" x="390" y="230">user_impersonation (admin consent)</text>
  <text class="t" x="390" y="254">Redirect URI: the connector's consent URL</text>
  <text class="t" x="390" y="276">Enterprise app: assignment required</text>
  <text class="m" x="390" y="296">→ grp-genie-copilot-users</text>
  <rect class="node" filter="url(#sh)" x="370" y="340" width="360" height="200" rx="10" style="stroke:#7c4dcc;stroke-width:1.6"/>
  <text class="h" x="390" y="367">Federated credential (replaces the secret)</text>
  <text class="s" x="390" y="391">Issuer</text>
  <text class="m" x="390" y="409">login.microsoftonline.com/&lt;tenant&gt;/v2.0</text>
  <text class="s" x="390" y="431">Subject (the connector's managed identity)</text>
  <text class="m" x="390" y="449">/eid1/c/pub/t/…/a/…/&lt;geo&gt;_&lt;connector-id&gt;</text>
  <text class="s" x="390" y="471">Audience</text>
  <text class="m" x="390" y="489">api://AzureADTokenExchange</text>
  <use href="#ok" x="390" y="506" width="15" height="15"/><text class="t" x="412" y="518">Client secrets: 0 · nothing expires</text>

  <!-- connector -->
  <rect class="node" filter="url(#sh)" x="790" y="160" width="330" height="128" rx="10"/>
  <text class="h" x="810" y="187">Consent service (token exchange)</text>
  <text class="m" x="810" y="209">global.consent.azure-apim.net</text>
  <text class="t" x="810" y="233">Redeems the sign-in code and</text>
  <text class="t" x="810" y="251">stores the user's tokens in the</text>
  <text class="t" x="810" y="269">user's connection</text>
  <rect class="node" filter="url(#sh)" x="790" y="320" width="330" height="108" rx="10"/>
  <text class="h" x="810" y="347">Custom connector · Genie One</text>
  <text class="t" x="810" y="369">Security: OAuth 2.0 · Entra ID</text>
  <text class="t" x="810" y="389">Secret option: Use managed identity</text>
  <text class="m" x="810" y="411">resource 2ff814a6-…-cd0e6f879c1d</text>
  <rect class="node" filter="url(#sh)" x="790" y="450" width="330" height="90" rx="10"/>
  <text class="h" x="810" y="477">Runs in the delegated subnet</text>
  <text class="t" x="810" y="499">Each call: Authorization: Bearer</text>
  <text class="t" x="810" y="519">&lt;user's Databricks token&gt;</text>

  <!-- databricks -->
  <rect class="node" filter="url(#sh)" x="1180" y="160" width="270" height="128" rx="10"/>
  <text class="h" x="1200" y="187">Token accepted</text>
  <text class="m" x="1200" y="209">accounts · aadTokenLogin</text>
  <text class="t" x="1200" y="233">identity = the user, for example</text>
  <text class="m" x="1200" y="253">mgr.user@contoso…</text>
  <text class="s" x="1200" y="275">from 10.10.3.x (private)</text>
  <rect class="node" filter="url(#sh)" x="1180" y="320" width="270" height="220" rx="10"/>
  <text class="h" x="1200" y="347">Unity Catalog decides</text>
  <text class="t" x="1200" y="371">drill.user → drilling only</text>
  <text class="t" x="1200" y="393">comp.user → completions only</text>
  <text class="t" x="1200" y="415">mgr.user → all three domains</text>
  <text class="s" x="1200" y="445">Genie One only sees the spaces</text>
  <text class="s" x="1200" y="463">and tables the user may use.</text>
  <text class="s" x="1200" y="491">Denied data is reported, never</text>
  <text class="s" x="1200" y="509">invented, by the agent.</text>

  <!-- arrows -->
  <line class="id" x1="310" y1="205" x2="368" y2="205" marker-end="url(#mp)"/>
  <circle class="badge" cx="339" cy="190" r="9"/><text class="bt" x="339" y="194" text-anchor="middle">1</text>
  <line class="id" x1="730" y1="200" x2="788" y2="200" marker-end="url(#mp)"/>
  <circle class="badge" cx="759" cy="185" r="9"/><text class="bt" x="759" y="189" text-anchor="middle">2</text>
  <path class="id" d="M955,288 V300 H760 V420 H732" marker-end="url(#mp)"/>
  <circle class="badge" cx="760" cy="360" r="9"/><text class="bt" x="760" y="364" text-anchor="middle">3</text>
  <path class="id" d="M730,470 H750 V245 H788" marker-end="url(#mp)" style="stroke-dasharray:6 4"/>
  <circle class="badge" cx="750" cy="500" r="9"/><text class="bt" x="750" y="504" text-anchor="middle">4</text>
  <path class="a" d="M180,540 V585 H955 V542" marker-end="url(#mb)"/>
  <circle class="badge" cx="560" cy="585" r="9"/><text class="bt" x="560" y="589" text-anchor="middle">5</text>
  <line class="a" x1="1120" y1="495" x2="1178" y2="230" marker-end="url(#mb)"/>

  <!-- steps -->
  <rect x="30" y="595" width="860" height="245" rx="14" fill="#f7f9fb" stroke="#e3e8ec"/>
  <text class="zl" x="50" y="622" fill="#33424c">WHAT HAPPENS</text>
  <g class="t">
    <circle class="badge" cx="59" cy="647" r="9"/><text class="bt" x="59" y="651" text-anchor="middle">1</text><text x="76" y="652">The user signs in to Entra through the app. Entra refuses anyone not in the assigned group (AADSTS50105).</text>
    <circle class="badge" cx="59" cy="677" r="9"/><text class="bt" x="59" y="681" text-anchor="middle">2</text><text x="76" y="682">Entra returns a sign-in code to the connector's redirect URL (the consent service).</text>
    <circle class="badge" cx="59" cy="707" r="9"/><text class="bt" x="59" y="711" text-anchor="middle">3</text><text x="76" y="712">To redeem the code, the connector presents a token of its managed identity instead of a client secret.</text>
    <circle class="badge" cx="59" cy="737" r="9"/><text class="bt" x="59" y="741" text-anchor="middle">4</text><text x="76" y="742">Entra matches the federated credential and issues a delegated token for Azure Databricks in the user's name.</text>
    <circle class="badge" cx="59" cy="767" r="9"/><text class="bt" x="59" y="771" text-anchor="middle">5</text><text x="76" y="772">Every tool call sends that token over the private path. Databricks applies the user's Unity Catalog grants.</text>
    <text x="76" y="806" class="s">Tokens refresh automatically. Removing a user from the group stops new tokens for them.</text>
    <text x="76" y="826" class="s">Re-importing the connector in another environment creates a new managed identity: add a federated credential for it.</text>
  </g>

  <rect x="910" y="595" width="560" height="245" rx="14" fill="#f7f9fb" stroke="#e3e8ec"/>
  <text class="zl" x="930" y="622" fill="#33424c">OPTIONS CONSIDERED</text>
  <use href="#no" x="930" y="640" width="16" height="16"/><text class="h" x="954" y="653">Client secret</text>
  <text class="s" x="954" y="673">stored in the connector; expires (sign-in breaks on that date);</text>
  <text class="s" x="954" y="691">must be rotated and protected</text>
  <use href="#no" x="930" y="707" width="16" height="16"/><text class="h" x="954" y="720">Databricks OAuth (workspace /oidc)</text>
  <text class="s" x="954" y="740">the code exchange runs outside your VNet, so it can't reach a</text>
  <text class="s" x="954" y="758">workspace whose public access is disabled</text>
  <use href="#ok" x="930" y="774" width="16" height="16"/><text class="h" x="954" y="787">Entra ID + managed identity + federated credential</text>
  <text class="s" x="954" y="807">no secret, nothing expires, trust limited to this connector;</text>
  <text class="s" x="954" y="825">Entra is always reachable · chosen</text>
</svg>
