<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-label="Build phases and outcome. Phase 1 Databricks foundation, phase 2 Power Platform environment and billing, phase 3 private network with VNet support, phase 4 secretless Genie One connector and Copilot Studio agent, phase 5 production hardening, phase 6 verification. All phases are complete. Outcome reached: fully private, one entry point, per-user permissions, one reply per question. Fallbacks such as a hardened public path or an API gateway were not needed.">
  <defs>
    <style>
      text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .title{font-size:25px;font-weight:700;fill:#0f1f2a}
      .subtitle{font-size:14px;fill:#5b6b76}
      .pn{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#d6f2e2}
      .ph{font-size:15px;font-weight:700;fill:#fff}
      .h{font-size:14px;font-weight:600;fill:#0f1f2a}
      .t{font-size:12.5px;fill:#33424c}
      .s{font-size:12px;fill:#5b6b76}
      .card{fill:#fff;stroke:#d6dee4;stroke-width:1.2}
    </style>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f1f2a" flood-opacity=".10"/></filter>
    <symbol id="ok" viewBox="-9 -9 18 18"><circle r="8.5" fill="#1f8a5b"/><path d="M-4 0.2 L-1.2 3 L4 -2.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="1499" height="699" rx="18" fill="#fff" stroke="#dfe5ea"/>
  <text class="title" x="40" y="50">Build phases and outcome</text>
  <text class="subtitle" x="40" y="76">Each phase answered one question and was verified before the next one started. All six phases are complete.</text>

  <g filter="url(#sh)">
    <rect class="card" x="30" y="100" width="230" height="330" rx="12"/>
    <rect class="card" x="275" y="100" width="230" height="330" rx="12"/>
    <rect class="card" x="520" y="100" width="230" height="330" rx="12"/>
    <rect class="card" x="765" y="100" width="230" height="330" rx="12"/>
    <rect class="card" x="1010" y="100" width="230" height="330" rx="12"/>
    <rect class="card" x="1255" y="100" width="215" height="330" rx="12"/>
  </g>
  <g>
    <path d="M30,112 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v58 h-230 z" fill="#1f7a4d"/>
    <path d="M275,112 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v58 h-230 z" fill="#1f7a4d"/>
    <path d="M520,112 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v58 h-230 z" fill="#1f7a4d"/>
    <path d="M765,112 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v58 h-230 z" fill="#1f7a4d"/>
    <path d="M1010,112 a12,12 0 0 1 12,-12 h206 a12,12 0 0 1 12,12 v58 h-230 z" fill="#1f7a4d"/>
    <path d="M1255,112 a12,12 0 0 1 12,-12 h191 a12,12 0 0 1 12,12 v58 h-215 z" fill="#1f7a4d"/>
    <text class="pn" x="48" y="124">PHASE 1</text><text class="ph" x="48" y="150">Databricks foundation</text>
    <text class="pn" x="293" y="124">PHASE 2</text><text class="ph" x="293" y="150">Power Platform</text>
    <text class="pn" x="538" y="124">PHASE 3</text><text class="ph" x="538" y="150">Private network</text>
    <text class="pn" x="783" y="124">PHASE 4</text><text class="ph" x="783" y="150">Connector and agent</text>
    <text class="pn" x="1028" y="124">PHASE 5</text><text class="ph" x="1028" y="150">Hardening</text>
    <text class="pn" x="1273" y="124">PHASE 6</text><text class="ph" x="1273" y="150">Verification</text>
  </g>
  <g class="t">
    <text x="46" y="196">Unity Catalog data and</text><text x="46" y="214">grants per domain group</text>
    <text x="46" y="240">Genie spaces shared</text><text x="46" y="258">per group</text>
    <text x="46" y="284">Genie One MCP server (GA)</text>
    <text x="46" y="310">Workspace private:</text><text x="46" y="328">public access disabled</text>
    <text x="291" y="196">Production environment,</text><text x="291" y="214">Managed, security group</text>
    <text x="291" y="240">Dataverse</text>
    <text x="291" y="266">Pay-as-you-go billing</text><text x="291" y="284">plan and budget</text>
    <text x="291" y="310">Copilot Studio maker</text><text x="291" y="328">access</text>
    <text x="536" y="196">Delegated /26 subnets in</text><text x="536" y="214">both regions of the pair</text>
    <text x="536" y="240">Peering + private DNS</text><text x="536" y="258">for the paired region</text>
    <text x="536" y="284">Enterprise policy linked</text><text x="536" y="302">to the environment</text>
    <text x="536" y="328">DNS, TCP, TLS tested</text><text x="536" y="346">from inside the subnet</text>
    <text x="781" y="196">Entra app, delegated</text><text x="781" y="214">permission, no secret</text>
    <text x="781" y="240">Custom connector with</text><text x="781" y="258">managed identity + FIC</text>
    <text x="781" y="284">Connector option A (REST</text><text x="781" y="302">actions) or B (MCP server)</text>
    <text x="781" y="328">Agent published to Teams</text><text x="781" y="346">and Microsoft 365 Copilot</text>
    <text x="1026" y="196">Assignment required</text>
    <text x="1026" y="222">Data policy with custom</text><text x="1026" y="240">connector rules</text>
    <text x="1026" y="266">Connector shared via a</text><text x="1026" y="284">Dataverse group team</text>
    <text x="1026" y="310">Delete locks, budget</text><text x="1026" y="328">alerts, auditing</text>
    <text x="1271" y="196">3 users × 2 questions</text>
    <text x="1271" y="222">Identity per call in</text><text x="1271" y="240">the audit log</text>
    <text x="1271" y="266">Every call from the</text><text x="1271" y="284">delegated subnet</text>
    <text x="1271" y="310">One reply per question</text>
  </g>
