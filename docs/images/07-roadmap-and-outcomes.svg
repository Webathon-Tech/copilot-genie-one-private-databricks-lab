  <use href="#ok" x="1269" y="396" width="18" height="18"/><text class="h" x="1293" y="410">Done</text>

  <line x1="60" y1="455" x2="1440" y2="455" stroke="#1f8a5b" stroke-width="2.4" marker-end="url(#mk)"/>

  <rect x="30" y="480" width="900" height="200" rx="14" fill="#eff8f3" stroke="#86c4a2"/>
  <use href="#ok" x="50" y="500" width="22" height="22"/>
  <text class="h" x="82" y="517" style="font-size:16px">Outcome reached: fully private, one entry point, per user, one reply</text>
  <text class="t" x="82" y="545">• Copilot reaches Genie One through Power Platform VNet support with public access disabled.</text>
  <text class="t" x="82" y="569">• Each user's own identity reaches Databricks; Unity Catalog decides what they see.</text>
  <text class="t" x="82" y="593">• No client secrets: managed identity with a federated credential.</text>
  <text class="t" x="82" y="617">• Every question, single- or cross-domain, is answered in one reply.</text>
  <text class="t" x="82" y="641">• Governed by a data policy, assignment required, locks, budgets and audit logs.</text>
  <text class="s" x="82" y="665">Details: 06-testing-and-verification.md</text>

  <rect x="950" y="480" width="520" height="200" rx="14" fill="#f7f9fb" stroke="#e3e8ec"/>
  <text class="h" x="970" y="510">Fallbacks not needed</text>
  <text class="t" x="970" y="538">• Hardened public path (IP access list of Microsoft</text>
  <text class="t" x="984" y="556">connector ranges): documented, not deployed</text>
  <text class="t" x="970" y="582">• API gateway in front of the workspace: not needed</text>
  <text class="t" x="970" y="608">• One tool per Genie space: not needed,</text>
  <text class="t" x="984" y="626">Genie One routes across spaces</text>
  <text class="s" x="970" y="656">Trade-offs: 07-design-decisions.md</text>
</svg>
